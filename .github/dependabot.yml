version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      development-tooling:
        patterns:
          - '@biomejs/*'
          - '@types/*'
          - typescript
          - vitest
    ignore:
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major
