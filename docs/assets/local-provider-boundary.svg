<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Local Provider 的文件边界与命令风险</title>
  <desc id="desc">文件 API 被限制在资源目录内，但命令进程继承当前操作系统用户权限，因此 Local Provider 不是安全 Sandbox。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
    <marker id="amber-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#D97706"/>
    </marker>
    <style>
      text { font-family: Inter, "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #111827; }
      .node { fill: #FFFFFF; stroke: #64748B; stroke-width: 2; rx: 12; }
      .safe { fill: #EFF6FF; stroke: #2563EB; stroke-width: 2.5; rx: 12; }
      .risk { fill: #FFF7ED; stroke: #D97706; stroke-width: 2.5; rx: 12; }
      .edge { fill: none; stroke: #64748B; stroke-width: 2.5; }
      .risk-edge { fill: none; stroke: #D97706; stroke-width: 2.5; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#FCFCFB"/>
  <text x="80" y="72" font-size="38" font-weight="700">Local Provider：文件 API 有边界，命令执行没有安全隔离</text>

  <rect x="60" y="120" width="1480" height="620" rx="20" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/>
  <text x="92" y="164" font-size="22" font-weight="700">宿主操作系统 · 当前用户权限</text>

  <rect x="110" y="210" width="760" height="440" rx="18" fill="#EFF6FF" stroke="#2563EB" stroke-width="3"/>
  <text x="145" y="254" font-size="22" font-weight="700" fill="#2563EB">Local Provider 资源目录</text>
  <rect class="safe" x="165" y="310" width="210" height="76"/>
  <text x="270" y="357" text-anchor="middle" font-size="22" font-weight="700">文件 API</text>
  <rect class="safe" x="445" y="290" width="340" height="116"/>
  <text x="615" y="335" text-anchor="middle" font-size="20" font-weight="700">路径与大小校验</text>
  <text x="615" y="370" text-anchor="middle" font-size="16" fill="#475569">相对路径 · realpath · no-follow</text>
  <rect class="node" x="445" y="480" width="340" height="100"/>
  <text x="615" y="525" text-anchor="middle" font-size="20" font-weight="700">Sandbox 文件</text>
  <text x="615" y="558" text-anchor="middle" font-size="16" fill="#475569">每个 generation 独立目录</text>
  <path class="edge" d="M375 348 H445"/>
  <path d="M445 348 L433 340 L433 356 Z" fill="#64748B"/>
  <path class="edge" d="M615 406 V480"/>
  <path d="M615 480 L607 466 L623 466 Z" fill="#64748B"/>
  <text x="200" y="620" font-size="17" fill="#2563EB">文件接口拒绝越界与符号链接目标</text>

  <rect class="risk" x="950" y="260" width="310" height="100"/>
  <text x="1105" y="305" text-anchor="middle" font-size="22" font-weight="700">命令进程</text>
  <text x="1105" y="338" text-anchor="middle" font-size="16" fill="#92400E">shell: false，但仍是宿主进程</text>
  <path d="M950 325 H870" fill="none" stroke="#D97706" stroke-width="2.5" stroke-dasharray="8 7"/>
  <path d="M870 325 L884 317 L884 333 Z" fill="#D97706"/>
  <text x="910" y="305" text-anchor="middle" font-size="15" fill="#D97706">cwd</text>

  <rect class="node" x="1320" y="210" width="170" height="72"/>
  <text x="1405" y="255" text-anchor="middle" font-size="18" font-weight="650">宿主文件系统</text>
  <rect class="node" x="1320" y="340" width="170" height="72"/>
  <text x="1405" y="385" text-anchor="middle" font-size="18" font-weight="650">网络</text>
  <rect class="node" x="1320" y="470" width="170" height="90"/>
  <text x="1405" y="510" text-anchor="middle" font-size="18" font-weight="650">凭据与服务</text>
  <text x="1405" y="538" text-anchor="middle" font-size="14" fill="#475569">若当前用户可访问</text>
  <path class="risk-edge" d="M1260 290 L1320 250"/>
  <path d="M1320 250 L1303 251 L1312 264 Z" fill="#D97706"/>
  <path class="risk-edge" d="M1260 310 L1320 376"/>
  <path d="M1320 376 L1304 370 L1316 359 Z" fill="#D97706"/>
  <path class="risk-edge" d="M1260 330 L1320 515"/>
  <path d="M1320 515 L1307 504 L1322 499 Z" fill="#D97706"/>

  <rect x="110" y="780" width="1380" height="78" rx="14" fill="#FFF7ED" stroke="#D97706" stroke-width="2"/>
  <text x="800" y="830" text-anchor="middle" font-size="23" font-weight="750" fill="#92400E">Local Provider ≠ 安全 Sandbox：禁止执行不可信或 AI 生成代码</text>
</svg>
